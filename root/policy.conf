# /etc/mrog/policy.conf - the allowlists mrog-apply reads. root-owned, T3.
#
# ⚠ EVERY PATTERN MUST BE QUOTED.
# Unquoted, bash expands the glob when this file is sourced. The first version
# of this file was unquoted, so MROG_WRITE_ALLOW became 285 literal paths that
# existed at source time (no new file could ever be written) and - far worse -
# MROG_DENY became 56 literal paths, meaning the never-touch list did not cover
# anything that did not already exist. A new /etc/sudoers.d/99-anything was
# never denied. Quote them.
#
# Matching is bash [[ == ]], where * also matches '/', so "/etc/*" covers
# /etc/a/b/c.

# --- never, under any lease (T3: Chris only, by hand) ---------------------
MROG_DENY=(
  "/boot/*" "/etc/default/grub" "/etc/fstab" "/etc/crypttab"
  "/etc/sudoers" "/etc/sudoers.d/*"
  "/etc/passwd" "/etc/shadow" "/etc/group" "/etc/gshadow"
  "/etc/mrog/*" "/usr/local/sbin/mrog-*" "/usr/local/bin/mrog"
  "/etc/wireguard/*" "$MROG_HOME/.ssh/*" "$MROG_HOME/.vault/*"
  "$MROG_ROOT/hooks/*" "$MROG_HOME/.claude/settings*"
)
# $MROG_HOME / $MROG_ROOT are exported by mrog-apply (from the caller's passwd entry) before
# this file is sourced -- double quotes expand the VARIABLE and still keep the GLOB literal.

# --- where a t2 lease may write ------------------------------------------
MROG_WRITE_ALLOW=(
  "/etc/*" "/usr/local/bin/*" "/usr/local/sbin/*" "/usr/local/share/*"
  "/etc/systemd/system/*"
)

# --- units a t1 lease may start/stop/restart ------------------------------
# Deliberately NOT here: anything that can cut the session or the fleet link
# (NetworkManager, tailscaled, wg-quick@*, ssh). Those want the auto-revert
# timer first, or a shell lease where Chris is watching.
MROG_UNITS=(
  docker.service libvirtd.service bluetooth.service cups.service
  systemd-timesyncd.service fwupd.service
  timeshift-ship.service timeshift-ship.timer
  laptop-backup.service
)

# --- packages a t1 lease may install --------------------------------------
MROG_PKGS=(
  shellcheck jq tree ncdu htop rofi borgbackup restic sysstat lm-sensors
  wmctrl xdotool inotify-tools ripgrep fd-find
)

# --- a SHELL lease runs arbitrary root commands. These are refused anyway --
#
# Be honest about what this list is: with a real root shell, it is a tripwire
# for the catastrophic and the obviously-out-of-bounds, not a sandbox. The
# actual control is that Chris armed a time-boxed lease with his password and
# every command lands in the journal with its output.
MROG_SHELL_DENY=(
  "*mkfs*" "*cryptsetup*" "*wipefs*" "*sgdisk*"
  "*rm -rf /" "*rm -rf /*" "*rm -fr /*"
  "*dd *of=/dev/*" "*shred /dev/*" "*> /dev/nvme*" "*> /dev/sd*"
  "*visudo*" "*/etc/sudoers*"
  "*userdel*" "*passwd *" "*usermod*"
  "*$MROG_HOME/.ssh/id_*" "*$MROG_HOME/.vault/*"
  "*/usr/local/sbin/mrog-*" "*/etc/mrog/*"
  "*chown -R * /" "*chmod -R 777 /*"
)
