# /etc/mrog/input-policy.conf - policy for agent keyboard/mouse control.
#
# QUOTE EVERY PATTERN. This file is sourced by bash; an unquoted glob is
# expanded against the filesystem at source time, which is exactly the bug
# that silently emptied the deny list in policy.conf on 2026-09-03.
#
# Matching is bash [[ == ]] against a LOWERCASED value, so write patterns in
# lower case. * also matches '/'.
#
# FLEET-CB2 2026-09-04 -- WHAT THE click/type SPLIT ACTUALLY BUYS. Measured:
# `xclip -selection primary` is NOT an input event and needs no lease, and
# `mrog-input click 2` then middle-click-pastes that text into whatever field
# has focus. Firefox here sets no middlemouse.paste override, so the Linux
# default (true) applies. So a "click" lease ALREADY grants arbitrary text
# injection, and the honest statement of the split is:
#     click = pointer, and any text you can put in the PRIMARY selection
#     type  = keystrokes proper -- Return, Tab, ctrl-chords, Escape
# Do not reason about a click lease as though it cannot type. Closing the gap
# means gating button 2 behind the type scope; that is staged separately
# because it would break a click-scoped drill mid-flight.

# --- limits ----------------------------------------------------------------
MROG_INPUT_MAX_MIN=15         # hard ceiling on a lease, in minutes
MROG_INPUT_MAX_EVENTS=400     # hard ceiling on events in one lease
MROG_INPUT_MIN_INTERVAL_MS=60 # floor on the gap between events
# Radius, in px, the pointer may drift before we assume a human took over.
# This panel is 141 dpi, so 1 inch = 141 px and 1.5 inches = 212. A hand resting
# on a mouse moves well under an inch; a deliberate grab moves further than that.
# On a different monitor, recompute: px = inches * (h_pixels / (width_mm / 25.4)).
MROG_INPUT_DRIFT_TOL=212

# --- window classes that may NEVER receive agent input ---------------------
# Password and authorisation prompts. Clicking "Authenticate" or typing into
# one of these is the single worst thing this tool could do.
MROG_INPUT_DENY_CLASS=(
  "*polkit*" "*gcr-prompter*" "*gnome-keyring*" "*askpass*"
  "*seahorse*" "*keepassxc*" "*bitwarden*" "*1password*"

  # Terminals. guard-bash inspects Bash TOOL CALLS; it cannot see keystrokes
  # delivered to a terminal window, so typing into one bypasses every
  # protection in the mrog shell layer.
  "*terminal*" "*konsole*" "*xterm*" "*alacritty*" "*kitty*" "*tilix*"
  "*wezterm*" "*ghostty*" "*terminator*"

  # VS Code carries an integrated terminal inside a window whose WM_CLASS is
  # indistinguishable from the editor's, so it is denied as a terminal.
  # Relax this ONLY if you accept that consequence.
  "*code*" "*vscodium*"

  # FLEET-CB2 2026-09-04. Agent CLIs that run shell commands. The Claude
  # desktop app's WM_CLASS is com.anthropic.claude and it matched NONE of the
  # patterns above while holding a Bash tool -- the exact capability the
  # terminal denials exist to keep away from agent input. It was the focused
  # window when the persona-test session started.
  # CONSEQUENCE, ACCEPTED: with this in place the first event of any drill
  # cannot be delivered while a Claude window has focus. Click the target
  # window once by hand after granting a lease.
  "*anthropic*" "*claude*"

  # Virtual machine consoles pass keystrokes straight through to another OS.
  "*virt-manager*" "*virt-viewer*" "*remote-viewer*" "*vmware*" "*virtualbox*"
)

# --- window titles that may NEVER receive agent input ----------------------
# TIER-REAL surface: third-party auth, spends money, public. A logged-in
# browser reaches all of it without a credential ever touching argv.
MROG_INPUT_DENY_TITLE=(
  "*cloudflare*" "*godaddy*" "*namecheap*"
  "*telegram*" "*whatsapp*" "*signal*"
  "*paypal*" "*stripe*" "*coinbase*" "*binance*" "*kraken*"
  "*solana*" "*phantom*" "*metamask*" "*wallet*"
  "*bank*" "*chase*" "*wells fargo*" "*capital one*"
  "*YouTube Studio*" "*suno*" "*openai*" "*console.anthropic*"
  "*password*" "*passphrase*" "*authenticate*" "*sign in*" "*log in*"
  "*sudo*" "*authentication required*"
)

# --- window classes allowed to receive input even if a title looks scary ---
# Empty by default. Anything here weakens the title deny list above.
MROG_INPUT_ALLOW_CLASS=()
